# Feet mmmmphh

- type: entity
  id: LeftFootLynxPaws
  parent: LeftFootCybernetic
  name: left lynx paw
  components:
  - type: BodyPart
  - type: Cyberware
    complexity: 2
  - type: CyberwareSymmetry
    selfID: LynxPawLeft
    sisterID: LynxPawRight
  - type: CyberwareCanEmp
  - type: CyberwareAddAction
    cyberwareAction: ActionActivateCyberwareToggle
    cyberwareEnabledPopupText: Your feet feel light as your steps go silent
    cyberwareDisabledPopupText: You feel the impacts of each step once more
    addParent:
    - type: FootstepVolumeModifier # TheDen - Add Light Step - Ninjas should be trained to be silent, no?
      sprintVolumeModifier: -15
      walkVolumeModifier: -15

