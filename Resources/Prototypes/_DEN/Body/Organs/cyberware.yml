  # Organs
  - type: entity
    id: OrganCyberneticAutoBreweryStomach
    parent: BaseCyberneticOrgan
    name: auto brewery stomach
    description: Gross. This is hard to stomach.
    components:
    - type: Organ
      slotId: stomach
    - type: Stomach
    - type: Sprite
      sprite: _DEN/Mobs/Organs/cyberware/organs.rsi
      state: autobrewery
    - type: SolutionContainerManager
      solutions:
        stomach:
          maxVol: 50
    - type: Cyberware
      complexity: 1
    # - type: CyberwareCanEmp
    - type: CyberwareStatic
      addSelf: # Adds the components below when the cybernetic is online and powered
      - type: Metabolizer
        maxReagents: 3
        metabolizerTypes: [Human, AutoBrewery]
        groups:
        - id: Food
        - id: Drink
      addBody:
      - type: Prying
        pryPowered: true
        speedModifier: 3.5 # fast because strong
        useSound:
          path: /Audio/Items/crowbar.ogg
