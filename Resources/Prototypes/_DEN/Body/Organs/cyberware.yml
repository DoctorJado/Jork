- type: entity
  id: DisposableAutodocBase
  parent: BaseItem
  name: disposable autodoc
  components:
  - type: Hands
  - type: HandsFill
    hands:
      multitool: OmnimedToolAutodoc
  - type: DoAfter
  - type: Item
    size: Small

- type: entity
  id: DisposableAutodocSyndicateCoprocessor
  parent: DisposableAutodocBase
  name: "disposable autodoc: syndicate coprocessor"
  components:
  - type: HandsFill
    hands:
      surgery_specific: OrganCyberneticSyndicateCoprocessor
  - type: DisposableAutodoc
    surgerySteps:
    - surgery: SurgeryOpenIncision
      part: 2
    - surgery: SurgeryRemoveCoprocessor
      part: 2
    - surgery: SurgeryInsertCoprocessor
      part: 2
    - surgery: SurgeryCloseIncision
      part: 2
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: tongue
