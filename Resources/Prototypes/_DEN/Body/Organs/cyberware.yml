# Organs
- type: entity
  id: OrganCyberneticAutoBreweryStomach
  parent: BaseCyberneticOrgan
  name: auto brewery stomach
  description: Gross. This is hard to stomach.
  components:
  - type: Organ
    slotId: stomach
  - type: Stomach
  - type: Sprite
    sprite: _DEN/Mobs/Organs/cyberware.rsi
    state: autobrewery
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
  - type: Cyberware
    complexity: 1
  - type: CyberwareCanEmp
  - type: CyberwareAddAction # this component is actually insane
    cyberwareAction: ActionActivateCyberwareToggle
    addParent:
    - type: SubdermalImplant
      implantAction: ActionActivateDnaScramblerImplant
  - type: SimpleCyberware
    addSelf: # Adds the components below when the cybernetic is online and powered
    - type: Metabolizer
      maxReagents: 3
      metabolizerTypes: [Human, AutoBrewery]
      groups:
      - id: Food
      - id: Drink
    addParent:
    - type: Prying
      pryPowered: true
      speedModifier: 3.5 # fast because strong
      useSound:
        path: /Audio/Items/crowbar.ogg

# Arms
- type: entity
  parent: LeftArmCybernetic
  id: GorillaArmLeftArm
  name: gorilla arm left
  description: A cybernetic left arm with the ability to pry doors open.
  components:
  - type: BodyPart
  - type: Cyberware
    complexity: 3
  - type: CyberwareCanEmp
  - type: CyberwareSymmetry
    selfID: GorillaArmLeft
    sisterID: GorillaArmRight
  - type: SimpleCyberware
    addParent:
    - type: GorillaArms # for potential conflicts with other traits that replace unarmed damage
      modifiers:
        coefficients:
          Blunt: 1.8
          Slash: 1.8
          Piercing: 1.8
          Heat: 1
          Poison: 1
          Asphyxiation: 1
    - type: Prying
      pryPowered: true
      speedModifier: 3.5 # fast because strong
      useSound:
        path: /Audio/Items/crowbar.ogg

